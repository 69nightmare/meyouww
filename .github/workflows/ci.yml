name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (unit tests, lint, debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --continue :core:model:test testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDebug || { cat app/build/reports/lint-results-debug.txt 2>/dev/null; exit 1; }
      - name: Build debug APK
        run: ./gradlew --stacktrace :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meyouww-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14

  backend:
    name: Backend (Deno tests, type check, pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function unit tests
        run: deno test supabase/functions/_shared/
      - name: Edge Function type check
        run: deno check supabase/functions/*/index.ts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start database
        run: npx --yes supabase@latest db start
      - name: pgTAP tests (RLS and functions)
        run: npx --yes supabase@latest test db

  smoke:
    name: Emulator smoke test (screenshots)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meyouww-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke_test.sh "$(ls apk/*.apk | head -1)" shots
      - name: Publish screenshots to the ci-screens branch
        if: always() && github.event_name == 'push'
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q
          git config user.name "meyouww-ci"
          git config user.email "ci@users.noreply.github.com"
          echo "Screenshots from ${GITHUB_SHA} (${GITHUB_REF_NAME})" > README.md
          git add -A
          git commit -q -m "Smoke-test screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screens
