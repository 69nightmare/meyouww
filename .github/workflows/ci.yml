name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (unit tests, lint, debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check string resources
        run: python3 scripts/check_strings.py
      - name: Unit tests
        run: ./gradlew --continue :core:model:test :core:scene:test testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDebug || { cat app/build/reports/lint-results-debug.txt 2>/dev/null; exit 1; }
      - name: Build debug APK
        run: ./gradlew --stacktrace :app:assembleDebug
      - name: Every class, Hilt ViewModel and worker is in the APK
        run: python3 scripts/check_apk_hilt.py app/build/outputs/apk/debug/app-debug.apk
      - name: APK size
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "APK size (all ABIs, for the emulator): $(( $(stat -c %s "$APK") / 1048576 )) MB"
          unzip -l "$APK" | sort -k1 -n -r | head -12
          if unzip -l "$APK" | grep -q libsignal_jni_testing; then echo "::error::libsignal test library is packaged"; exit 1; fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meyouww-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14

  backend:
    name: Backend (Deno tests, type check, pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function unit tests
        run: deno test supabase/functions/_shared/
      - name: Edge Function type check
        run: deno check supabase/functions/*/index.ts
      - name: Dashboard bundles are up to date and type-check
        run: |
          python3 scripts/bundle_functions.py --check
          deno check supabase/bundled/*.ts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start database
        # Retried once: the runner sometimes still holds the port from a previous container.
        run: |
          npx --yes supabase@latest db start || {
            npx --yes supabase@latest stop --no-backup || true
            docker ps -aq | xargs -r docker rm -f || true
            sleep 10
            npx --yes supabase@latest db start
          }
      - name: pgTAP tests (RLS and functions)
        run: npx --yes supabase@latest test db

  smoke:
    name: Emulator smoke test (screenshots)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: meyouww-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke_test.sh "$(ls apk/*.apk | head -1)" shots
      - name: Publish screenshots to the ci-screens branch
        if: always() && github.event_name == 'push'
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Screenshots from ${GITHUB_SHA} (${GITHUB_REF_NAME})" > README.md
          git add -A
          git commit -q -m "Smoke-test screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screens
