name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (unit tests, lint, debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional: when these repository secrets exist the APK talks to your backend.
      MEYOUWW_SUPABASE_URL: ${{ secrets.MEYOUWW_SUPABASE_URL }}
      MEYOUWW_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MEYOUWW_SUPABASE_PUBLISHABLE_KEY }}
      MEYOUWW_FIREBASE_PROJECT_ID: ${{ secrets.MEYOUWW_FIREBASE_PROJECT_ID }}
      MEYOUWW_FIREBASE_APP_ID: ${{ secrets.MEYOUWW_FIREBASE_APP_ID }}
      MEYOUWW_FIREBASE_API_KEY: ${{ secrets.MEYOUWW_FIREBASE_API_KEY }}
      MEYOUWW_FIREBASE_SENDER_ID: ${{ secrets.MEYOUWW_FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --continue :core:model:test testDebugUnitTest
      - name: Lint
        run: ./gradlew --stacktrace :app:lintDebug
      - name: Build debug APK
        run: ./gradlew --stacktrace :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meyouww-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14

  backend:
    name: Backend (Deno tests, type check, pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function unit tests
        run: deno test supabase/functions/_shared/
      - name: Edge Function type check
        run: deno check supabase/functions/*/index.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start database
        run: supabase db start
      - name: pgTAP tests (RLS and functions)
        run: supabase test db
