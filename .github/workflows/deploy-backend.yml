name: Deploy backend

# Applies database migrations, auth settings, function secrets and Edge Functions to the
# hosted Supabase project. Runs on pushes to main that touch the backend, or by hand.
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/supabase_deploy.py"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Read project ref
        run: echo "SUPABASE_PROJECT_REF=$(grep -E '^SUPABASE_PROJECT_REF=' config/backend.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_ENV"
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Skipped: add the SUPABASE_ACCESS_TOKEN repository secret (docs/SETUP.md) to deploy the backend."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Migrations, auth settings and function secrets
        if: steps.cfg.outputs.ready == 'true'
        run: python3 scripts/supabase_deploy.py
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: "22"
      - name: Deploy Edge Functions
        if: steps.cfg.outputs.ready == 'true'
        run: npx --yes supabase@latest functions deploy register-device update-device-state test-push --project-ref "$SUPABASE_PROJECT_REF"
