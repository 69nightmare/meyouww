name: Inspect released APK (temporary)
on:
  push:
    branches: [inspect-apk]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check v0.12.0 for missing Hilt bindings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.12.0 --repo "$GITHUB_REPOSITORY" --pattern 'meyouww-v0.12.0.apk' --dir /tmp/apk
          python3 scripts/check_apk_hilt.py /tmp/apk/meyouww-v0.12.0.apk || true
          DEXDUMP=$(ls $ANDROID_HOME/build-tools/*/dexdump | sort -V | tail -1)
          cd /tmp && mkdir dex && cd dex && unzip -q /tmp/apk/meyouww-v0.12.0.apk 'classes*.dex'
          for d in classes*.dex; do $DEXDUMP $d | grep -E "Class descriptor.*(ChatViewModel|hilt_aggregated_deps.*chat)" ; done | sort | head -40
