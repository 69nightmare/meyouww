name: Release APK

# Builds the app and attaches the APK to a GitHub Release named after the app's
# versionName (for example v0.1.0), so it can be downloaded straight from the
# repository's Releases page with no GitHub login.
# Runs on every push to main or to the "release" branch, on v* tags, or by hand.
# Pushing again with the same versionName replaces the APK in that release and
# moves its tag to the new commit.
on:
  push:
    branches: [main, release]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        # Phones are ARM: leaving out the emulator (x86) code keeps the APK small. The "fast"
        # build type is release speed with the shared test key (see app/build.gradle.kts).
        # Built without Gradle's build cache: a cached piece once left the chat screens out
        # of v0.12.0 (opening a chat crashed). Slower, but every release is built from scratch.
        run: ./gradlew --stacktrace --no-build-cache :app:assembleFast -Pmeyouww.abis=arm64-v8a,armeabi-v7a
      - name: Every class, Hilt ViewModel and worker is in the APK
        run: python3 scripts/check_apk_hilt.py app/build/outputs/apk/fast/app-fast.apk
      - name: Check the APK size
        run: |
          APK=app/build/outputs/apk/fast/app-fast.apk
          SIZE=$(stat -c %s "$APK")
          echo "APK size: $((SIZE / 1048576)) MB"
          unzip -l "$APK" | sort -k1 -n -r | head -15
          # Unstripped native libraries made 0.6.0-0.8.0 over 600 MB; never ship that again.
          if [ "$SIZE" -gt $((120 * 1048576)) ]; then echo "::error::APK is larger than 120 MB"; exit 1; fi
      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -E 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          mkdir -p dist
          cp app/build/outputs/apk/fast/app-fast.apk "dist/meyouww-${TAG}.apk"
          sha256sum "dist/meyouww-${TAG}.apk" | tee "dist/meyouww-${TAG}.apk.sha256"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.tag }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          # "What's new": this version's section of docs/STATUS.md (the app's update pop-up shows it).
          WHATS_NEW=$(awk -v v="## v${VERSION}:" 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' docs/STATUS.md)
          cat > notes.md <<EOF
          **meyouww ${VERSION}** (test build, debug-signed)

          ### What's new
          ${WHATS_NEW}

          ### How to install

          How to install on an Android phone (Android 8 or newer):
          1. Download \`meyouww-${TAG}.apk\` below on the phone.
          2. Open it. Android asks once to allow installs from your browser or Files app.
          3. Every meyouww test build uses the same signing key, so later builds install over this one.

          After signing in, open **Profile and settings → Background delivery** and run the test.

          Built from commit ${GITHUB_SHA}. Checksum: see the .sha256 file.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
              # Rebuilt from a branch: point the tag and notes at this commit.
              # (Tag pushes made with the workflow token don't start new runs.)
              git push -f origin "${GITHUB_SHA}:refs/tags/${TAG}"
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" dist/* --title "meyouww ${TAG}" --notes-file notes.md --prerelease --target "${GITHUB_SHA}"
          fi
